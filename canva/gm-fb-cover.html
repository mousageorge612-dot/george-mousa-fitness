<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">

<style>*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Cairo,sans-serif}
.page{width:1640px;height:924px;background:#050505;color:#fff;position:relative;overflow:hidden}
.glow{position:absolute;right:120px;top:120px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(255,184,0,.35) 0%,rgba(255,184,0,.08) 45%,rgba(255,184,0,0) 70%)}
.bigword{position:absolute;right:40px;top:40px;font-family:'Bebas Neue';font-size:300px;line-height:1;color:#141414;letter-spacing:6px}
.bar{position:absolute;right:0;top:0;width:1640px;height:10px;background:#FFB800}
.photo{position:absolute;right:150px;top:150px;width:640px;height:auto}
.fade{position:absolute;right:0;bottom:0;width:1640px;height:120px;background:linear-gradient(to top,#050505,rgba(5,5,5,0))}
.text{position:absolute;right:830px;top:140px;width:700px}
.logo{display:block;width:360px;height:auto;margin-bottom:26px}
.eyebrow{font-family:'Bebas Neue';font-size:40px;letter-spacing:8px;color:#FFB800;line-height:1}

.y{color:#FFB800}
.sub{font-size:28px;font-weight:600;color:#cfcfcf;line-height:1.5;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
.chip{background:#141414;border:2px solid #3a2c00;border-radius:999px;padding:8px 22px;font-size:25px;font-weight:800;color:#fff}
.cta{display:flex;gap:16px;margin-top:30px;align-items:center}
.btn{background:#FFB800;color:#000;border-radius:999px;padding:10px 34px;font-size:30px;font-weight:900}
.site{font-family:'Bebas Neue';font-size:42px;letter-spacing:3px;color:#fff}
.wa{display:flex;gap:12px;margin-top:18px;font-size:26px;font-weight:800;color:#cfcfcf}.num{direction:ltr;unicode-bidi:isolate}.x{font-size:24px;font-weight:800;color:#fff}
